[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-reporting"
version = "1.0.0"
description = "Secure, auditable automated reporting from Excel/CSV files (cleaning, PII protection, charts, XLSX/PDF/HTML reports)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
    "matplotlib>=3.8,<4",
    "reportlab>=4.2,<5",
    "jinja2>=3.1.4,<4",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.5",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
excel-reporting = "excel_reporting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["excel_reporting"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
